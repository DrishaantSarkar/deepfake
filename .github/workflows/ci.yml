name: TRUSTLENS CI & Quality Assurance

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Test Suite & Smoke Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d "DEEPFAKE--Final_Integrated" ]; then
            cd DEEPFAKE--Final_Integrated
          fi
          pip install -r requirements-dev.txt

      - name: Static asset syntax verification
        run: |
          if [ -d "DEEPFAKE--Final_Integrated" ]; then
            cd DEEPFAKE--Final_Integrated
          fi
          node --check trustlens/static/app.js

      - name: Run unit tests
        run: |
          if [ -d "DEEPFAKE--Final_Integrated" ]; then
            cd DEEPFAKE--Final_Integrated
          fi
          export TRUSTLENS_TEMP_DIR="$PWD/.trustlens-test-tmp"
          python -m unittest discover -s tests -v

      - name: Run process restart & persistence smoke test
        run: |
          if [ -d "DEEPFAKE--Final_Integrated" ]; then
            cd DEEPFAKE--Final_Integrated
          fi
          python tests/http_restart_smoke.py

      - name: Run HTTP smoke test with live loopback server
        run: |
          if [ -d "DEEPFAKE--Final_Integrated" ]; then
            cd DEEPFAKE--Final_Integrated
          fi
          export TRUSTLENS_PORT=8765
          export TRUSTLENS_DB_PATH="$PWD/.trustlens-test-tmp/smoke.sqlite3"
          export TRUSTLENS_TEMP_DIR="$PWD/.trustlens-test-tmp/smoke-media"
          export TRUSTLENS_BASE_URL="http://127.0.0.1:8765"
          python -m trustlens.web &
          SERVER_PID=$!
          sleep 4
          python tests/http_smoke.py
          kill $SERVER_PID
